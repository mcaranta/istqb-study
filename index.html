<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<title>ISTQB CTFL Study Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #fafaf9;
  --surface: #ffffff;
  --fg: #1c1917;
  --fg-muted: #78716c;
  --border: #e7e5e4;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --correct: #16a34a;
  --correct-light: #dcfce7;
  --wrong: #dc2626;
  --wrong-light: #fee2e2;
  --skipped: #d97706;
  --skipped-light: #fef3c7;
  --radius: 10px;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --nav-height: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0a09;
    --surface: #1c1917;
    --fg: #fafaf9;
    --fg-muted: #a8a29e;
    --border: #292524;
    --accent: #60a5fa;
    --accent-light: #1e3a5f;
    --correct: #4ade80;
    --correct-light: #14532d;
    --wrong: #f87171;
    --wrong-light: #7f1d1d;
    --skipped: #fbbf24;
    --skipped-light: #78350f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0a09;
  --surface: #1c1917;
  --fg: #fafaf9;
  --fg-muted: #a8a29e;
  --border: #292524;
  --accent: #60a5fa;
  --accent-light: #1e3a5f;
  --correct: #4ade80;
  --correct-light: #14532d;
  --wrong: #f87171;
  --wrong-light: #7f1d1d;
  --skipped: #fbbf24;
  --skipped-light: #78350f;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: 1.6;
  max-width: 760px;
  margin: 0 auto;
  padding: 0 16px;
  padding-bottom: calc(var(--nav-height) + 16px);
  -webkit-font-smoothing: antialiased;
}

/* Bottom Navigation */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--nav-height);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: center;
  z-index: 200;
}
.bottom-nav-inner {
  display: flex;
  max-width: 760px;
  width: 100%;
}
.nav-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--fg-muted);
  font-family: var(--font-body);
  font-size: 0.65rem;
  font-weight: 500;
  cursor: pointer;
  padding: 6px 0;
  transition: color 0.15s;
}
.nav-tab svg { width: 22px; height: 22px; stroke-width: 1.8; }
.nav-tab.active { color: var(--accent); }
.nav-tab:hover { color: var(--accent); }

/* Views */
.view { display: none; }
.view.active { display: block; }

/* Shared components */
.page-header {
  text-align: center;
  padding: 1.5rem 0 1rem;
}
.page-header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.page-header p {
  color: var(--fg-muted);
  font-size: 0.88rem;
  margin-top: 0.3rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 0.75rem;
  transition: border-color 0.2s;
}
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--accent); }

.btn {
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 0.7rem 1.8rem;
  border: none;
  border-radius: 99px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.btn:hover { opacity: 0.9; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.btn-outline {
  background: transparent;
  border: 1.5px solid var(--accent);
  color: var(--accent);
}
.btn.btn-sm { font-size: 0.8rem; padding: 0.5rem 1.2rem; }
.btn.btn-correct { background: var(--correct); }
.btn.btn-wrong { background: var(--wrong); }

.chip {
  display: inline-flex;
  align-items: center;
  padding: 0.4rem 0.9rem;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--fg);
  font: inherit;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.chip:hover { border-color: var(--accent); }
.chip.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 600; }

.chip-group { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.5rem 0;
}
.toggle-label { font-size: 0.9rem; font-weight: 500; }
.toggle {
  width: 44px;
  height: 24px;
  border-radius: 12px;
  background: var(--border);
  border: none;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
}
.toggle.on { background: var(--accent); }
.toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(20px); }

/* Stats row */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.5rem;
  margin: 1rem 0;
}
.stats-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.stat-box {
  text-align: center;
  padding: 0.7rem 0.4rem;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
}
.stat-num {
  font-family: var(--font-mono);
  font-size: 1.3rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.stat-num.green { color: var(--correct); }
.stat-num.red { color: var(--wrong); }
.stat-num.blue { color: var(--accent); }
.stat-label { font-size: 0.7rem; color: var(--fg-muted); margin-top: 0.1rem; }

/* Chapter mastery bar */
.mastery-bar-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}
.mastery-bar-row:last-child { border-bottom: none; }
.mastery-ch-label { min-width: 0; flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mastery-bar-track {
  width: 100px;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  flex-shrink: 0;
}
.mastery-bar-fill {
  height: 100%;
  border-radius: 4px;
  background: var(--accent);
  transition: width 0.4s ease;
}
.mastery-pct {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 600;
  min-width: 36px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* History list */
.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}
.history-item:last-child { border-bottom: none; }
.history-exam { font-weight: 600; }
.history-score { font-family: var(--font-mono); font-weight: 600; }
.history-date { color: var(--fg-muted); font-size: 0.78rem; }

/* Study chapter cards */
.chapter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  margin: 1rem 0;
}
@media (max-width: 480px) { .chapter-grid { grid-template-columns: 1fr; } }
.chapter-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.1s;
}
.chapter-card:hover { border-color: var(--accent); }
.chapter-card:active { transform: scale(0.98); }
.chapter-card .ch-num {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.chapter-card .ch-name {
  font-weight: 600;
  font-size: 0.9rem;
  margin: 0.2rem 0 0.4rem;
  line-height: 1.3;
}
.chapter-card .ch-meta {
  font-size: 0.75rem;
  color: var(--fg-muted);
}
.chapter-card .ch-bar {
  margin-top: 0.5rem;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.chapter-card .ch-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
}

/* Flashcard */
.flashcard-area { margin: 1rem 0; }
.flashcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  min-height: 200px;
}
.flashcard .q-number {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.3rem;
}
.flashcard .q-chapter {
  display: inline-block;
  font-size: 0.7rem;
  background: var(--accent-light);
  color: var(--accent);
  padding: 0.1rem 0.5rem;
  border-radius: 99px;
  margin-left: 0.5rem;
  font-weight: 600;
}
.flashcard .q-text {
  font-size: 0.95rem;
  font-weight: 500;
  margin: 0.6rem 0;
  line-height: 1.55;
  white-space: pre-line;
}
.flashcard .answer-reveal {
  margin-top: 1rem;
  padding: 1rem;
  border-radius: 8px;
  background: var(--correct-light);
  border: 1px solid var(--correct);
  font-size: 0.88rem;
  line-height: 1.55;
}
.flashcard .answer-reveal .answer-label {
  font-weight: 700;
  color: var(--correct);
  margin-bottom: 0.3rem;
}
.flashcard .answer-reveal .justification {
  color: var(--fg-muted);
  font-size: 0.82rem;
  margin-top: 0.5rem;
}
.flashcard-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0.75rem 0;
}
.flashcard-nav .progress-text {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--fg-muted);
}
.flashcard-btns {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  margin: 0.75rem 0;
}
.filter-row {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.75rem;
}

/* Summary section */
.chapter-summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 1rem;
  font-size: 0.88rem;
  line-height: 1.6;
}
.chapter-summary h3 { font-size: 1rem; margin-bottom: 0.5rem; }

/* Quiz */
.quiz-setup { padding: 1rem 0; }
.quiz-setup h3 {
  font-size: 0.9rem;
  font-weight: 600;
  margin: 1rem 0 0.3rem;
  color: var(--fg-muted);
}

/* Question card in quiz/exam */
.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  margin: 1rem 0;
  transition: border-color 0.2s;
}
.question-card.correct-card { border-color: var(--correct); background: var(--correct-light); }
.question-card.wrong-card { border-color: var(--wrong); background: var(--wrong-light); }
.q-number {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.3rem;
}
.q-chapter-tag {
  display: inline-block;
  font-size: 0.7rem;
  background: var(--accent-light);
  color: var(--accent);
  padding: 0.1rem 0.5rem;
  border-radius: 99px;
  margin-left: 0.5rem;
  font-weight: 600;
}
.multi-select-badge {
  display: inline-block;
  font-size: 0.68rem;
  background: var(--skipped-light);
  color: var(--skipped);
  padding: 0.1rem 0.5rem;
  border-radius: 99px;
  margin-left: 0.4rem;
  font-weight: 600;
}
.q-text {
  font-size: 0.95rem;
  font-weight: 500;
  margin: 0.4rem 0 0.8rem;
  line-height: 1.55;
  white-space: pre-line;
}
.options { display: flex; flex-direction: column; gap: 0.45rem; }
.option-btn {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  padding: 0.65rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--fg);
  font: inherit;
  font-size: 0.9rem;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s;
  line-height: 1.5;
  width: 100%;
}
.option-btn:hover { border-color: var(--accent); background: var(--accent-light); }
.option-btn.selected { border-color: var(--accent); background: var(--accent-light); font-weight: 500; }
.option-btn.correct-opt { border-color: var(--correct); background: var(--correct-light); }
.option-btn.wrong-opt { border-color: var(--wrong); background: var(--wrong-light); }
.option-btn .letter {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 0.8rem;
  min-width: 1.4rem;
  height: 1.4rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  background: var(--border);
  flex-shrink: 0;
  margin-top: 0.1rem;
}
.option-btn.selected .letter { background: var(--accent); color: #fff; }
.option-btn.correct-opt .letter { background: var(--correct); color: #fff; }
.option-btn.wrong-opt .letter { background: var(--wrong); color: #fff; }
.option-btn[disabled] { cursor: default; opacity: 0.85; }
.option-btn[disabled]:hover { border-color: var(--border); background: transparent; }
.option-btn.selected[disabled]:hover { border-color: var(--accent); background: var(--accent-light); }
.option-btn.correct-opt[disabled]:hover { border-color: var(--correct); background: var(--correct-light); }
.option-btn.wrong-opt[disabled]:hover { border-color: var(--wrong); background: var(--wrong-light); }

.explanation {
  margin-top: 0.75rem;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 0.85rem;
  line-height: 1.55;
  color: var(--fg-muted);
}
.explanation strong { color: var(--fg); }

/* Progress bar */
.progress-bar-wrap {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--border);
}
.progress-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.82rem;
  color: var(--fg-muted);
  font-weight: 500;
}
.progress-track {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s ease;
  width: 0%;
}
.timer {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  min-width: 52px;
  text-align: right;
}
.timer.warning { color: var(--wrong); }

/* Results panel */
.results-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin: 1rem 0;
}
.results-panel h2 {
  font-size: 1.3rem;
  font-weight: 700;
  margin: 0 0 0.3rem;
}
.score-big {
  font-family: var(--font-mono);
  font-size: 3rem;
  font-weight: 700;
  line-height: 1.1;
}
.score-big.pass { color: var(--correct); }
.score-big.fail { color: var(--wrong); }
.score-label { font-size: 0.85rem; color: var(--fg-muted); margin-top: 0.2rem; }

/* Chapter breakdown in results */
.chapter-breakdown { margin-top: 1.25rem; }
.chapter-breakdown h3 { font-size: 0.95rem; font-weight: 600; margin: 0 0 0.75rem; }
.chapter-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}
.chapter-row:last-child { border-bottom: none; }
.chapter-name { flex: 1; min-width: 0; }
.chapter-bar-wrap {
  width: 100px;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  flex-shrink: 0;
}
.chapter-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
}
.chapter-pct {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  min-width: 40px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* Weak areas compact card */
.weak-card {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 0.5rem;
  cursor: pointer;
  transition: border-color 0.15s;
}
.weak-card:hover { border-color: var(--accent); }
.weak-card .status-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
  flex-shrink: 0;
}
.weak-card .status-icon.wrong { background: var(--wrong-light); color: var(--wrong); }
.weak-card .status-icon.unseen { background: var(--border); color: var(--fg-muted); }
.weak-card .weak-info { flex: 1; min-width: 0; }
.weak-card .weak-id { font-family: var(--font-mono); font-size: 0.72rem; color: var(--fg-muted); }
.weak-card .weak-text {
  font-size: 0.82rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Exam picker */
.exam-pick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  margin: 1rem 0;
}
.exam-pick-card {
  text-align: center;
  padding: 1.5rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 0.2s, transform 0.1s;
}
.exam-pick-card:hover { border-color: var(--accent); }
.exam-pick-card:active { transform: scale(0.98); }
.exam-pick-card .exam-letter {
  font-family: var(--font-mono);
  font-size: 2rem;
  font-weight: 700;
  color: var(--accent);
}
.exam-pick-card .exam-desc { font-size: 0.82rem; color: var(--fg-muted); margin-top: 0.3rem; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--fg-muted);
}
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.empty-state h3 { font-size: 1.1rem; color: var(--fg); margin-bottom: 0.3rem; }
.empty-state p { font-size: 0.88rem; }

/* Back button */
.back-row {
  padding: 0.75rem 0 0.25rem;
}
.back-btn {
  background: none;
  border: none;
  color: var(--accent);
  font: inherit;
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
}
.back-btn:hover { text-decoration: underline; }

/* Utility */
.mt-1 { margin-top: 0.5rem; }
.mt-2 { margin-top: 1rem; }
.mt-3 { margin-top: 1.5rem; }
.text-center { text-align: center; }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- =============================== VIEWS =============================== -->

<!-- Dashboard View -->
<div id="view-dashboard" class="view active">
  <div class="page-header">
    <h1>ISTQB CTFL Study Hub</h1>
    <p>CTFL v4.0 Exam Preparation</p>
  </div>
  <div class="card">
    <div style="font-weight:600; font-size:0.9rem; margin-bottom:0.75rem;">Mastery Overview</div>
    <div id="dash-mastery-bars"></div>

<h4>What This Chapter Covers</h4>
<p>This chapter details black-box, white-box, experience-based, and collaboration-based test techniques, including how to derive test cases and calculate coverage for each.</p>

<h4>Black-Box Test Techniques</h4>
<ul>

  <li><strong>Boundary Value Analysis (BVA)</strong> &mdash; tests boundaries of ordered partitions. <strong>2-value BVA</strong>: boundary + nearest neighbor in adjacent partition. <strong>3-value BVA</strong>: boundary + both neighbors (more rigorous, catches defects 2-value misses). Coverage = <code>boundary values exercised / total boundary values</code>.</li>
  <li><strong>Decision Table Testing</strong> &mdash; columns = rules (condition combinations &rarr; actions). Notation: T/F/&ndash;/N/A for conditions, X/blank for actions. Coverage = <code>feasible columns exercised / total feasible columns</code>. Number of rules grows exponentially with conditions.</li>
  <li><strong>State Transition Testing</strong> &mdash; uses state diagrams/tables. Three coverage levels: <strong>all states</strong> (weakest), <strong>valid transitions</strong> (0-switch, most common), <strong>all transitions</strong> (includes invalid, strongest). Each stronger level subsumes the weaker ones.</li>

<ul>

/* ============================================================

   ============================================================ */
var StudyApp = {
  STORAGE_KEY: 'istqb-study-progress',

  state: {
    currentView: 'dashboard',
    questionStats: {},
    examHistory: [],
    settings: { instantFeedback: true }
  },

  /* Persistence */
  loadState: function() {
    try {
      var saved = localStorage.getItem(this.STORAGE_KEY);
      if (saved) {
        var parsed = JSON.parse(saved);
        this.state.questionStats = parsed.questionStats || {};
        this.state.examHistory = parsed.examHistory || [];
        this.state.settings = parsed.settings || { instantFeedback: true };
      }
    } catch(e) { /* ignore */ }
  },

  saveState: function() {
    try {
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify({
        questionStats: this.state.questionStats,
        examHistory: this.state.examHistory,
        settings: this.state.settings
      }));
    } catch(e) { /* ignore */ }
  },

  getStats: function(qId) {
    if (!this.state.questionStats[qId]) {
      this.state.questionStats[qId] = { attempts: 0, correct: 0, lastSeen: 0, mastered: false, flagged: false };
    }
    return this.state.questionStats[qId];
  },

  recordAnswer: function(qId, isCorrect) {
    var s = this.getStats(qId);
    s.attempts++;
    if (isCorrect) s.correct++;
    s.lastSeen = Date.now();
    s.mastered = s.correct >= 2 && (s.correct / s.attempts) >= 0.66;
    this.saveState();
  },

  toggleFlag: function(qId) {
    var s = this.getStats(qId);
    s.flagged = !s.flagged;
    this.saveState();
  },

  /* Chapter helpers */
  getChapterQuestions: function(chNum) {
    return ALL_QUESTIONS.filter(function(q) { return q.chapterNum === chNum; });
  },

  getChapterMastery: function(chNum) {
    var qs = this.getChapterQuestions(chNum);
    if (qs.length === 0) return 0;
    var mastered = 0;
    var self = this;
    qs.forEach(function(q) {
      if (self.getStats(q.id).mastered) mastered++;
    });
    return Math.round((mastered / qs.length) * 100);
  },

  getWeakestChapter: function() {
    var weakest = 1, lowest = 101;
    for (var ch = 1; ch <= 6; ch++) {
      var m = this.getChapterMastery(ch);
      if (m < lowest && this.getChapterQuestions(ch).length > 0) {
        lowest = m; weakest = ch;
      }
    }
    return weakest;
  },

  getGlobalStats: function() {
    var total = ALL_QUESTIONS.length;
    var attempted = 0, correctTotal = 0, attemptsTotal = 0, mastered = 0;
    var self = this;
    ALL_QUESTIONS.forEach(function(q) {
      var s = self.getStats(q.id);
      if (s.attempts > 0) { attempted++; correctTotal += s.correct; attemptsTotal += s.attempts; }
      if (s.mastered) mastered++;
    });
    return {
      total: total,
      attempted: attempted,
      accuracy: attemptsTotal > 0 ? Math.round((correctTotal / attemptsTotal) * 100) : 0,
      mastered: mastered
    };
  },

  /* Navigation */
  switchView: function(view) {
    this.state.currentView = view;
    document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
    document.getElementById('view-' + view).classList.add('active');
    document.querySelectorAll('.nav-tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-view') === view);
    });
    this.renderCurrentView();
  },

  renderCurrentView: function() {
    switch(this.state.currentView) {
      case 'dashboard': this.renderDashboard(); break;
      case 'study': this.renderStudy(); break;
      case 'quiz': this.renderQuizSetup(); break;
      case 'weak': this.renderWeak(); break;
      case 'exam': this.renderExamPicker(); break;
    }
  },

  continueStudying: function() {
    this.switchView('study');
    this.study.selectChapter(this.getWeakestChapter());
  },

  /* ============================================================
     DASHBOARD
     ============================================================ */
  renderDashboard: function() {
    var html = '';
    for (var ch = 1; ch <= 6; ch++) {
      var pct = this.getChapterMastery(ch);
      var count = this.getChapterQuestions(ch).length;
      html += '<div class="mastery-bar-row">'
        + '<span class="mastery-ch-label">Ch ' + ch + ' ' + (count > 0 ? '' : '(0q)') + '</span>'
        + '<div class="mastery-bar-track"><div class="mastery-bar-fill" style="width:' + pct + '%; background:' + (pct >= 80 ? 'var(--correct)' : pct >= 40 ? 'var(--accent)' : 'var(--wrong)') + '"></div></div>'
        + '<span class="mastery-pct">' + pct + '%</span>'
        + '</div>';
    }
    document.getElementById('dash-mastery-bars').innerHTML = html;

    var gs = this.getGlobalStats();
    document.getElementById('dash-stats').innerHTML =
      '<div class="stat-box"><div class="stat-num blue">' + gs.total + '</div><div class="stat-label">Total</div></div>'
      + '<div class="stat-box"><div class="stat-num">' + gs.attempted + '</div><div class="stat-label">Attempted</div></div>'
      + '<div class="stat-box"><div class="stat-num">' + gs.accuracy + '%</div><div class="stat-label">Accuracy</div></div>'
      + '<div class="stat-box"><div class="stat-num green">' + gs.mastered + '</div><div class="stat-label">Mastered</div></div>';

    var hist = this.state.examHistory.slice(-3).reverse();
    if (hist.length === 0) {
      document.getElementById('dash-history').innerHTML = '<div style="color:var(--fg-muted);font-size:0.85rem;">No exams taken yet</div>';
    } else {
      var hHtml = '';
      hist.forEach(function(h) {
        var pct = Math.round((h.score / h.total) * 100);
        hHtml += '<div class="history-item">'
          + '<span class="history-exam">Exam ' + h.exam + '</span>'
          + '<span class="history-date">' + h.date + '</span>'
          + '<span class="history-score" style="color:' + (pct >= 65 ? 'var(--correct)' : 'var(--wrong)') + '">' + h.score + '/' + h.total + ' (' + pct + '%)</span>'
          + '</div>';
      });
      document.getElementById('dash-history').innerHTML = hHtml;
    }
  },

  /* ============================================================
     STUDY
     ============================================================ */
  study: {
    selectedChapter: null,
    currentIndex: 0,
    filteredQuestions: [],
    filter: 'all',
    answerRevealed: false,

    selectChapter: function(ch) {
      this.selectedChapter = ch;
      this.filter = 'all';
      this.applyFilter();
      this.currentIndex = 0;
      this.answerRevealed = false;
      document.getElementById('study-picker').classList.add('hidden');
      document.getElementById('study-detail').classList.remove('hidden');
      this.render();
    },

    backToChapters: function() {
      this.selectedChapter = null;
      document.getElementById('study-picker').classList.remove('hidden');
      document.getElementById('study-detail').classList.add('hidden');
      StudyApp.renderStudy();
    },

    applyFilter: function() {
      var ch = this.selectedChapter;
      var all = StudyApp.getChapterQuestions(ch);
      if (this.filter === 'unmastered') {
        this.filteredQuestions = all.filter(function(q) { return !StudyApp.getStats(q.id).mastered; });
      } else if (this.filter === 'flagged') {
        this.filteredQuestions = all.filter(function(q) { return StudyApp.getStats(q.id).flagged; });
      } else {
        this.filteredQuestions = all;
      }
      if (this.currentIndex >= this.filteredQuestions.length) this.currentIndex = 0;
    },

    setFilter: function(f) {
      this.filter = f;
      this.applyFilter();
      this.currentIndex = 0;
      this.answerRevealed = false;
      this.render();
    },

    render: function() {
      // Summary
      document.getElementById('study-summary').innerHTML =
        '<div class="chapter-summary">' + (CHAPTER_SUMMARIES[this.selectedChapter] || '') + '</div>';

      // Filters
      var filters = ['all', 'unmastered', 'flagged'];
      var labels = { all: 'All', unmastered: 'Unmastered', flagged: 'Flagged' };
      var self = this;
      var fHtml = '';
      filters.forEach(function(f) {
        fHtml += '<button class="chip' + (self.filter === f ? ' selected' : '') + '" onclick="StudyApp.study.setFilter(\'' + f + '\')">' + labels[f] + '</button>';
      });
      document.getElementById('study-filters').innerHTML = fHtml;

      if (this.filteredQuestions.length === 0) {
        document.getElementById('study-nav').innerHTML = '';
        document.getElementById('study-flashcard').innerHTML = '<div class="empty-state"><div class="empty-icon">&#10003;</div><h3>All clear!</h3><p>No questions match this filter.</p></div>';
        document.getElementById('study-btns').innerHTML = '';
        return;
      }

      var q = this.filteredQuestions[this.currentIndex];
      // Nav
      document.getElementById('study-nav').innerHTML =
        '<button class="btn btn-sm btn-outline" onclick="StudyApp.study.prev()" ' + (this.currentIndex === 0 ? 'disabled' : '') + '>&#8592; Prev</button>'
        + '<span class="progress-text">Card ' + (this.currentIndex + 1) + ' of ' + this.filteredQuestions.length + '</span>'
        + '<button class="btn btn-sm btn-outline" onclick="StudyApp.study.next()" ' + (this.currentIndex >= this.filteredQuestions.length - 1 ? 'disabled' : '') + '>Next &#8594;</button>';

      // Flashcard
      var correctAnswer;
      if (Array.isArray(q.answer)) {
        correctAnswer = q.answer.map(function(i) { return q.options[i]; }).join('<br>');
      } else {
        correctAnswer = q.options[q.answer];
      }

      var fcHtml = '<div class="flashcard">'
        + '<div class="q-number">Q' + q.id + ' <span class="q-chapter">' + (q.chapter || 'Ch ' + q.chapterNum) + '</span></div>'
        + '<div class="q-text">' + q.text + '</div>';

      if (this.answerRevealed) {
        fcHtml += '<div class="answer-reveal">'
          + '<div class="answer-label">Correct Answer</div>'
          + '<div>' + correctAnswer + '</div>'
          + '<div class="justification">' + (q.justification || '') + '</div>'
          + '</div>';
      }
      fcHtml += '</div>';
      document.getElementById('study-flashcard').innerHTML = fcHtml;

      // Buttons
      if (!this.answerRevealed) {
        document.getElementById('study-btns').innerHTML = '<button class="btn" onclick="StudyApp.study.reveal()">Show Answer</button>';
      } else {
        document.getElementById('study-btns').innerHTML =
          '<button class="btn btn-correct" onclick="StudyApp.study.gotIt()">Got it</button>'
          + '<button class="btn btn-wrong" onclick="StudyApp.study.reviewAgain()">Review Again</button>';
      }
    },

    reveal: function() {
      this.answerRevealed = true;
      this.render();
    },

    gotIt: function() {
      var q = this.filteredQuestions[this.currentIndex];
      StudyApp.recordAnswer(q.id, true);
      this.advance();
    },

    reviewAgain: function() {
      var q = this.filteredQuestions[this.currentIndex];
      StudyApp.recordAnswer(q.id, false);
      StudyApp.getStats(q.id).flagged = true;
      StudyApp.saveState();
      this.advance();
    },

    advance: function() {
      this.answerRevealed = false;
      this.applyFilter();
      if (this.filteredQuestions.length === 0) { this.render(); return; }
      if (this.currentIndex >= this.filteredQuestions.length) this.currentIndex = 0;
      else this.currentIndex = Math.min(this.currentIndex, this.filteredQuestions.length - 1);
      this.render();
    },

    prev: function() {
      if (this.currentIndex > 0) { this.currentIndex--; this.answerRevealed = false; this.render(); }
    },

    next: function() {
      if (this.currentIndex < this.filteredQuestions.length - 1) { this.currentIndex++; this.answerRevealed = false; this.render(); }
    }
  },

  renderStudy: function() {
    if (this.study.selectedChapter) { this.study.render(); return; }
    document.getElementById('study-picker').classList.remove('hidden');
    document.getElementById('study-detail').classList.add('hidden');
    var html = '';
    for (var ch = 1; ch <= 6; ch++) {
      var count = this.getChapterQuestions(ch).length;
      var pct = this.getChapterMastery(ch);
      html += '<div class="chapter-card" onclick="StudyApp.study.selectChapter(' + ch + ')">'
        + '<div class="ch-num">Chapter ' + ch + '</div>'
        + '<div class="ch-name">' + CHAPTER_NAMES[ch] + '</div>'
        + '<div class="ch-meta">' + count + ' questions &middot; ' + pct + '% mastered</div>'
        + '<div class="ch-bar"><div class="ch-bar-fill" style="width:' + pct + '%"></div></div>'
        + '</div>';
    }
    document.getElementById('study-chapters').innerHTML = html;
  },

  /* ============================================================
     QUIZ
     ============================================================ */
  quiz: {
    count: 20,
    chapters: [1,2,3,4,5,6],
    exams: ['A','B','C','D'],
    questions: [],
    answers: [],
    currentIdx: 0,
    submitted: false,
    feedbackShown: false,

    toggleInstant: function() {
      StudyApp.state.settings.instantFeedback = !StudyApp.state.settings.instantFeedback;
      StudyApp.saveState();
      this.renderToggle();
    },

    renderToggle: function() {
      var el = document.getElementById('quiz-instant-toggle');
      if (el) el.className = 'toggle' + (StudyApp.state.settings.instantFeedback ? ' on' : '');
    },

    start: function() {
      var self = this;
      var pool = ALL_QUESTIONS.filter(function(q) {
        return self.chapters.indexOf(q.chapterNum) !== -1 && self.exams.indexOf(q.exam) !== -1;
      });
      // Shuffle
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      this.questions = pool.slice(0, this.count);
      this.answers = this.questions.map(function(q) { return q.multiSelect ? [] : -1; });
      this.currentIdx = 0;
      this.submitted = false;
      this.feedbackShown = false;

      document.getElementById('quiz-setup').classList.add('hidden');
      document.getElementById('quiz-results').classList.add('hidden');
      document.getElementById('quiz-active').classList.remove('hidden');
      this.renderQuestion();
    },

    renderQuestion: function() {
      if (this.submitted) { this.renderResults(); return; }
      var q = this.questions[this.currentIdx];
      var ans = this.answers[this.currentIdx];
      var letters = 'abcdefgh';
      var answered = this.feedbackShown;
      var instant = StudyApp.state.settings.instantFeedback;

      var pct = Math.round(((this.currentIdx + (answered ? 1 : 0)) / this.questions.length) * 100);
      var html = '<div class="progress-bar-wrap"><div class="progress-row">'
        + '<span>Q' + (this.currentIdx + 1) + '/' + this.questions.length + '</span>'
        + '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>'
        + '</div></div>';

      var multiTag = q.multiSelect ? ' <span class="multi-select-badge">Select TWO</span>' : '';
      html += '<div class="question-card">'
        + '<div class="q-number">Question ' + (this.currentIdx + 1) + multiTag + ' <span class="q-chapter-tag">' + (q.chapter || 'Ch ' + q.chapterNum) + '</span></div>'
        + '<div class="q-text">' + q.text + '</div>'
        + '<div class="options">';

      for (var i = 0; i < q.options.length; i++) {
        var cls = 'option-btn';
        var isSelected = q.multiSelect ? (ans.indexOf(i) !== -1) : (ans === i);
        if (isSelected) cls += ' selected';
        if (answered) {
          var isCorrect = Array.isArray(q.answer) ? q.answer.indexOf(i) !== -1 : q.answer === i;
          if (isCorrect) cls += ' correct-opt';
          else if (isSelected) cls += ' wrong-opt';
        }
        html += '<button class="option-btn ' + cls + '"'
          + (answered ? ' disabled' : ' onclick="StudyApp.quiz.selectOption(' + i + ')"')
          + '><span class="letter">' + letters[i] + '</span><span>' + q.options[i] + '</span></button>';
      }
      html += '</div>';

      if (answered) {
        html += '<div class="explanation"><strong>Explanation:</strong> ' + (q.justification || 'No explanation available.') + '</div>';
      }
      html += '</div>';

      // Buttons
      html += '<div class="text-center mt-2">';
      if (answered) {
        html += '<button class="btn" onclick="StudyApp.quiz.nextQuestion()">Next</button>';
      } else if (!instant) {
        if (this.currentIdx < this.questions.length - 1) {
          html += '<button class="btn btn-outline" onclick="StudyApp.quiz.nextQuestion()">Next</button>';
        } else {
          html += '<button class="btn" onclick="StudyApp.quiz.submitAll()">Submit Quiz</button>';
        }
      }
      html += '</div>';

      document.getElementById('quiz-active').innerHTML = html;
    },

    selectOption: function(idx) {
      var q = this.questions[this.currentIdx];
      if (q.multiSelect) {
        var arr = this.answers[this.currentIdx];
        var pos = arr.indexOf(idx);
        if (pos !== -1) arr.splice(pos, 1);
        else if (arr.length < 2) arr.push(idx);
      } else {
        this.answers[this.currentIdx] = idx;
      }

      if (StudyApp.state.settings.instantFeedback) {
        var ready = q.multiSelect ? this.answers[this.currentIdx].length === 2 : this.answers[this.currentIdx] !== -1;
        if (ready) {
          this.feedbackShown = true;
          this.recordCurrent();
        }
      }
      this.renderQuestion();
    },

    recordCurrent: function() {
      var q = this.questions[this.currentIdx];
      var ans = this.answers[this.currentIdx];
      var correct = this.isCorrect(q, ans);
      StudyApp.recordAnswer(q.id, correct);
    },

    isCorrect: function(q, ans) {
      if (q.multiSelect) {
        if (!Array.isArray(ans)) return false;
        var sorted = ans.slice().sort();
        var exp = q.answer.slice().sort();
        return sorted.length === exp.length && sorted.every(function(v, i) { return v === exp[i]; });
      }
      return ans === q.answer;
    },

    nextQuestion: function() {
      if (!StudyApp.state.settings.instantFeedback && !this.feedbackShown) {
        // record without feedback
        if (this.answers[this.currentIdx] !== -1) this.recordCurrent();
      }
      this.feedbackShown = false;
      if (this.currentIdx < this.questions.length - 1) {
        this.currentIdx++;
        this.renderQuestion();
      } else {
        this.submitAll();
      }
    },

    submitAll: function() {
      var self = this;
      // Record any unrecorded
      this.questions.forEach(function(q, idx) {
        if (!StudyApp.state.settings.instantFeedback) {
          var correct = self.isCorrect(q, self.answers[idx]);
          StudyApp.recordAnswer(q.id, correct);
        }
      });
      this.submitted = true;
      this.renderResults();
    },

    renderResults: function() {
      document.getElementById('quiz-active').classList.add('hidden');
      document.getElementById('quiz-results').classList.remove('hidden');

      var self = this;
      var score = 0;
      var chapterCorrect = {};
      var chapterTotal = {};
      var wrongQuestions = [];

      this.questions.forEach(function(q, idx) {
        var correct = self.isCorrect(q, self.answers[idx]);
        if (correct) score++;
        else wrongQuestions.push({ q: q, idx: idx });
        if (!chapterTotal[q.chapterNum]) { chapterTotal[q.chapterNum] = 0; chapterCorrect[q.chapterNum] = 0; }
        chapterTotal[q.chapterNum]++;
        if (correct) chapterCorrect[q.chapterNum]++;
      });

      var total = this.questions.length;
      var pct = Math.round((score / total) * 100);

      var html = '<div class="results-panel">'
        + '<h2>Quiz Results</h2>'
        + '<div class="score-big ' + (pct >= 65 ? 'pass' : 'fail') + '">' + pct + '%</div>'
        + '<div class="score-label">' + score + ' out of ' + total + ' correct</div>'
        + '<div class="stats-grid cols-3 mt-2">'
        + '<div class="stat-box"><div class="stat-num green">' + score + '</div><div class="stat-label">Correct</div></div>'
        + '<div class="stat-box"><div class="stat-num red">' + (total - score) + '</div><div class="stat-label">Wrong</div></div>'
        + '<div class="stat-box"><div class="stat-num">' + total + '</div><div class="stat-label">Total</div></div>'
        + '</div>';

      html += '<div class="chapter-breakdown"><h3>Chapter Breakdown</h3>';
      for (var ch = 1; ch <= 6; ch++) {
        if (!chapterTotal[ch]) continue;
        var cPct = Math.round((chapterCorrect[ch] / chapterTotal[ch]) * 100);
        html += '<div class="chapter-row">'
          + '<span class="chapter-name">Ch ' + ch + '</span>'
          + '<div class="chapter-bar-wrap"><div class="chapter-bar" style="width:' + cPct + '%; background:' + (cPct >= 80 ? 'var(--correct)' : cPct >= 50 ? 'var(--accent)' : 'var(--wrong)') + '"></div></div>'
          + '<span class="chapter-pct">' + cPct + '%</span>'
          + '</div>';
      }
      html += '</div>';

      if (wrongQuestions.length > 0) {
        html += '<div style="margin-top:1rem;"><h3 style="font-size:0.95rem;font-weight:600;margin-bottom:0.5rem;">Wrong Answers</h3>';
        wrongQuestions.forEach(function(w) {
          html += '<div style="padding:0.4rem 0;border-bottom:1px solid var(--border);font-size:0.85rem;">'
            + '<strong>Q' + (w.idx + 1) + '</strong>: ' + w.q.text.substring(0, 80) + '...'
            + '</div>';
        });
        html += '</div>';
      }

      html += '</div>';
      html += '<div class="text-center mt-2"><button class="btn btn-outline" onclick="StudyApp.quiz.reset()">New Quiz</button></div>';

      document.getElementById('quiz-results').innerHTML = html;
    },

    reset: function() {
      document.getElementById('quiz-setup').classList.remove('hidden');
      document.getElementById('quiz-active').classList.add('hidden');
      document.getElementById('quiz-results').classList.add('hidden');
      StudyApp.renderQuizSetup();
    }
  },

  renderQuizSetup: function() {
    var q = this.quiz;
    // Count chips
    var counts = [10, 20, 40];
    var html = '';
    counts.forEach(function(c) {
      html += '<button class="chip' + (q.count === c ? ' selected' : '') + '" onclick="StudyApp.quiz.count=' + c + ';StudyApp.renderQuizSetup()">' + c + '</button>';
    });
    document.getElementById('quiz-count-chips').innerHTML = html;

    // Chapter chips
    html = '';
    for (var ch = 1; ch <= 6; ch++) {
      var sel = q.chapters.indexOf(ch) !== -1;
      html += '<button class="chip' + (sel ? ' selected' : '') + '" onclick="StudyApp.toggleQuizChapter(' + ch + ')">Ch ' + ch + '</button>';
    }
    document.getElementById('quiz-chapter-chips').innerHTML = html;

    // Exam chips
    html = '';
    ['A','B','C','D'].forEach(function(e) {
      var sel = q.exams.indexOf(e) !== -1;
      html += '<button class="chip' + (sel ? ' selected' : '') + '" onclick="StudyApp.toggleQuizExam(\'' + e + '\')">Exam ' + e + '</button>';
    });
    document.getElementById('quiz-exam-chips').innerHTML = html;

    q.renderToggle();
    document.getElementById('quiz-setup').classList.remove('hidden');
    document.getElementById('quiz-active').classList.add('hidden');
    document.getElementById('quiz-results').classList.add('hidden');
  },

  toggleQuizChapter: function(ch) {
    var idx = this.quiz.chapters.indexOf(ch);
    if (idx !== -1) this.quiz.chapters.splice(idx, 1);
    else this.quiz.chapters.push(ch);
    this.renderQuizSetup();
  },

  toggleQuizExam: function(e) {
    var idx = this.quiz.exams.indexOf(e);
    if (idx !== -1) this.quiz.exams.splice(idx, 1);
    else this.quiz.exams.push(e);
    this.renderQuizSetup();
  },

  /* ============================================================
     WEAK AREAS
     ============================================================ */
  weak: {
    openId: null,
    answerRevealed: false,

    openCard: function(qId) {
      this.openId = qId;
      this.answerRevealed = false;
      StudyApp.renderWeak();
    },

    closeCard: function() {
      this.openId = null;
      StudyApp.renderWeak();
    },

    reveal: function() {
      this.answerRevealed = true;
      StudyApp.renderWeak();
    },

    gotIt: function() {
      StudyApp.recordAnswer(this.openId, true);
      this.openId = null;
      StudyApp.renderWeak();
    },

    reviewAgain: function() {
      StudyApp.recordAnswer(this.openId, false);
      StudyApp.getStats(this.openId).flagged = true;
      StudyApp.saveState();
      this.openId = null;
      StudyApp.renderWeak();
    }
  },

  renderWeak: function() {
    var self = this;
    // Get weak questions: wrong first, then never-attempted
    var wrong = [];
    var unseen = [];
    ALL_QUESTIONS.forEach(function(q) {
      var s = self.getStats(q.id);
      if (s.mastered) return;
      if (s.attempts > 0 && s.correct < s.attempts) wrong.push(q);
      else if (s.attempts === 0) unseen.push(q);
    });

    // Sort by chapter
    var sorter = function(a, b) { return a.chapterNum - b.chapterNum; };
    wrong.sort(sorter);
    unseen.sort(sorter);
    var allWeak = wrong.concat(unseen);

    document.getElementById('weak-count').textContent = allWeak.length + ' questions to review';

    // Check if flashcard is open
    if (this.weak.openId) {
      var q = ALL_QUESTIONS.find(function(q) { return q.id === self.weak.openId; });
      if (!q) { this.weak.openId = null; this.renderWeak(); return; }

      var correctAnswer;
      if (Array.isArray(q.answer)) {
        correctAnswer = q.answer.map(function(i) { return q.options[i]; }).join('<br>');
      } else {
        correctAnswer = q.options[q.answer];
      }

      var html = '<div class="back-row"><button class="back-btn" onclick="StudyApp.weak.closeCard()">&#8592; Back to list</button></div>';
      html += '<div class="flashcard">'
        + '<div class="q-number">Q' + q.id + ' <span class="q-chapter">' + (q.chapter || 'Ch ' + q.chapterNum) + '</span></div>'
        + '<div class="q-text">' + q.text + '</div>';

      if (this.weak.answerRevealed) {
        html += '<div class="answer-reveal">'
          + '<div class="answer-label">Correct Answer</div>'
          + '<div>' + correctAnswer + '</div>'
          + '<div class="justification">' + (q.justification || '') + '</div>'
          + '</div>';
      }
      html += '</div>';

      html += '<div class="flashcard-btns">';
      if (!this.weak.answerRevealed) {
        html += '<button class="btn" onclick="StudyApp.weak.reveal()">Show Answer</button>';
      } else {
        html += '<button class="btn btn-correct" onclick="StudyApp.weak.gotIt()">Got it</button>'
          + '<button class="btn btn-wrong" onclick="StudyApp.weak.reviewAgain()">Review Again</button>';
      }
      html += '</div>';

      document.getElementById('weak-list').classList.add('hidden');
      document.getElementById('weak-flashcard').classList.remove('hidden');
      document.getElementById('weak-flashcard').innerHTML = html;
      return;
    }

    document.getElementById('weak-list').classList.remove('hidden');
    document.getElementById('weak-flashcard').classList.add('hidden');

    if (allWeak.length === 0) {
      document.getElementById('weak-list').innerHTML = '<div class="empty-state"><div class="empty-icon">&#127942;</div><h3>Congratulations!</h3><p>You have mastered all questions. Keep it up!</p></div>';
      return;
    }

    var html = '';
    allWeak.forEach(function(q) {
      var s = self.getStats(q.id);
      var isWrong = s.attempts > 0;
      html += '<div class="weak-card" onclick="StudyApp.weak.openCard(\'' + q.id + '\')">'
        + '<div class="status-icon ' + (isWrong ? 'wrong' : 'unseen') + '">' + (isWrong ? '&#10007;' : '?') + '</div>'
        + '<div class="weak-info">'
        + '<div class="weak-id">' + q.id + ' <span class="q-chapter-tag">Ch ' + q.chapterNum + '</span></div>'
        + '<div class="weak-text">' + q.text.substring(0, 70) + (q.text.length > 70 ? '...' : '') + '</div>'
        + '</div></div>';
    });
    document.getElementById('weak-list').innerHTML = html;
  },

  /* ============================================================
     EXAM SIMULATOR
     ============================================================ */
  exam: {
    selectedExam: null,
    questions: [],
    answers: [],
    currentIdx: 0,
    submitted: false,
    timerInterval: null,
    secondsLeft: 3600,

    pick: function(examCode) {
      this.selectedExam = examCode;
      var pool;
      if (examCode === 'MIX') {
        pool = ALL_QUESTIONS.slice();
      } else {
        pool = ALL_QUESTIONS.filter(function(q) { return q.exam === examCode; });
      }
      // Shuffle
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      this.questions = pool.slice(0, 40);
      this.answers = this.questions.map(function(q) { return q.multiSelect ? [] : -1; });
      this.currentIdx = 0;
      this.submitted = false;
      this.secondsLeft = 3600;

      document.getElementById('exam-picker').classList.add('hidden');
      document.getElementById('exam-results').classList.add('hidden');
      document.getElementById('exam-active').classList.remove('hidden');

      var self = this;
      clearInterval(this.timerInterval);
      this.timerInterval = setInterval(function() {
        self.secondsLeft--;
        if (self.secondsLeft <= 0) { self.submit(); }
        self.updateTimer();
      }, 1000);

      this.renderExam();
    },

    updateTimer: function() {
      var el = document.getElementById('exam-timer');
      if (!el) return;
      var m = Math.floor(this.secondsLeft / 60);
      var s = this.secondsLeft % 60;
      el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
      el.className = 'timer' + (this.secondsLeft < 300 ? ' warning' : '');
    },

    renderExam: function() {
      var self = this;
      var q = this.questions[this.currentIdx];
      var ans = this.answers[this.currentIdx];
      var letters = 'abcdefgh';
      var answered = this.answeredCount();
      var pct = Math.round((answered / this.questions.length) * 100);

      var html = '<div class="progress-bar-wrap"><div class="progress-row">'
        + '<span>' + answered + '/' + this.questions.length + '</span>'
        + '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>'
        + '<span class="timer" id="exam-timer"></span>'
        + '</div></div>';

      var multiTag = q.multiSelect ? ' <span class="multi-select-badge">Select TWO</span>' : '';
      html += '<div class="question-card">'
        + '<div class="q-number">Question ' + (this.currentIdx + 1) + ' of ' + this.questions.length + multiTag
        + ' <span class="q-chapter-tag">' + (q.chapter || 'Ch ' + q.chapterNum) + '</span></div>'
        + '<div class="q-text">' + q.text + '</div>'
        + '<div class="options">';

      for (var i = 0; i < q.options.length; i++) {
        var isSelected = q.multiSelect ? (ans.indexOf(i) !== -1) : (ans === i);
        html += '<button class="option-btn' + (isSelected ? ' selected' : '') + '" onclick="StudyApp.exam.selectOption(' + i + ')">'
          + '<span class="letter">' + letters[i] + '</span><span>' + q.options[i] + '</span></button>';
      }
      html += '</div></div>';

      // Navigation dots
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:1rem 0;">';
      for (var n = 0; n < this.questions.length; n++) {
        var dotAns = this.answers[n];
        var dotAnswered = Array.isArray(dotAns) ? dotAns.length > 0 : dotAns !== -1;
        var dotCls = n === this.currentIdx ? 'border-color:var(--accent);color:var(--accent);' : '';
        if (dotAnswered) dotCls += 'background:var(--accent-light);';
        html += '<button style="width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--fg-muted);font:500 0.7rem var(--font-mono);cursor:pointer;display:flex;align-items:center;justify-content:center;' + dotCls + '" onclick="StudyApp.exam.goTo(' + n + ')">' + (n + 1) + '</button>';
      }
      html += '</div>';

      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin:0.5rem 0;">'
        + '<button class="btn btn-sm btn-outline" onclick="StudyApp.exam.prev()" ' + (this.currentIdx === 0 ? 'disabled' : '') + '>&#8592; Prev</button>'
        + '<button class="btn btn-sm btn-outline" onclick="StudyApp.exam.next()" ' + (this.currentIdx >= this.questions.length - 1 ? 'disabled' : '') + '>Next &#8594;</button>'
        + '</div>';

      html += '<div class="text-center mt-2"><button class="btn" onclick="StudyApp.exam.submit()">Submit Exam</button></div>';

      document.getElementById('exam-active').innerHTML = html;
      this.updateTimer();
    },

    answeredCount: function() {
      var count = 0;
      this.answers.forEach(function(a) {
        if (Array.isArray(a)) { if (a.length > 0) count++; }
        else { if (a !== -1) count++; }
      });
      return count;
    },

    selectOption: function(idx) {
      var q = this.questions[this.currentIdx];
      if (q.multiSelect) {
        var arr = this.answers[this.currentIdx];
        var pos = arr.indexOf(idx);
        if (pos !== -1) arr.splice(pos, 1);
        else if (arr.length < 2) arr.push(idx);
      } else {
        this.answers[this.currentIdx] = idx;
      }
      this.renderExam();
    },

    goTo: function(n) { this.currentIdx = n; this.renderExam(); },
    prev: function() { if (this.currentIdx > 0) { this.currentIdx--; this.renderExam(); } },
    next: function() { if (this.currentIdx < this.questions.length - 1) { this.currentIdx++; this.renderExam(); } },

    submit: function() {
      clearInterval(this.timerInterval);
      this.submitted = true;

      var self = this;
      var score = 0;
      var chapterCorrect = {};
      var chapterTotal = {};
      var wrongQuestions = [];

      this.questions.forEach(function(q, idx) {
        var ans = self.answers[idx];
        var correct;
        if (q.multiSelect) {
          if (!Array.isArray(ans) || ans.length === 0) { correct = false; }
          else {
            var sorted = ans.slice().sort();
            var exp = q.answer.slice().sort();
            correct = sorted.length === exp.length && sorted.every(function(v, i) { return v === exp[i]; });
          }
        } else {
          correct = ans === q.answer;
        }

        if (correct) score++;
        else wrongQuestions.push({ q: q, idx: idx, userAnswer: ans });

        StudyApp.recordAnswer(q.id, correct);

        if (!chapterTotal[q.chapterNum]) { chapterTotal[q.chapterNum] = 0; chapterCorrect[q.chapterNum] = 0; }
        chapterTotal[q.chapterNum]++;
        if (correct) chapterCorrect[q.chapterNum]++;
      });

      // Save to history
      var breakdown = {};
      for (var ch in chapterTotal) {
        breakdown[ch] = { correct: chapterCorrect[ch] || 0, total: chapterTotal[ch] };
      }
      StudyApp.state.examHistory.push({
        exam: this.selectedExam,
        date: new Date().toISOString().split('T')[0],
        score: score,
        total: this.questions.length,
        breakdown: breakdown
      });
      StudyApp.saveState();

      // Render results
      document.getElementById('exam-active').classList.add('hidden');
      document.getElementById('exam-results').classList.remove('hidden');

      var total = this.questions.length;
      var pct = Math.round((score / total) * 100);
      var letters = 'abcdefgh';

      var html = '<div class="results-panel">'
        + '<h2>Exam ' + this.selectedExam + ' Results</h2>'
        + '<div class="score-big ' + (pct >= 65 ? 'pass' : 'fail') + '">' + pct + '%</div>'
        + '<div class="score-label">' + score + ' out of ' + total + ' correct' + (pct >= 65 ? ' - PASS' : ' - FAIL (65% needed)') + '</div>'
        + '<div class="stats-grid cols-3 mt-2">'
        + '<div class="stat-box"><div class="stat-num green">' + score + '</div><div class="stat-label">Correct</div></div>'
        + '<div class="stat-box"><div class="stat-num red">' + (total - score) + '</div><div class="stat-label">Wrong</div></div>'
        + '<div class="stat-box"><div class="stat-num">' + total + '</div><div class="stat-label">Total</div></div>'
        + '</div>';

      // Chapter breakdown
      html += '<div class="chapter-breakdown"><h3>Chapter Breakdown</h3>';
      for (var ch = 1; ch <= 6; ch++) {
        if (!chapterTotal[ch]) continue;
        var cPct = Math.round(((chapterCorrect[ch] || 0) / chapterTotal[ch]) * 100);
        html += '<div class="chapter-row">'
          + '<span class="chapter-name">Ch ' + ch + '</span>'
          + '<div class="chapter-bar-wrap"><div class="chapter-bar" style="width:' + cPct + '%; background:' + (cPct >= 80 ? 'var(--correct)' : cPct >= 50 ? 'var(--accent)' : 'var(--wrong)') + '"></div></div>'
          + '<span class="chapter-pct">' + cPct + '%</span>'
          + '</div>';
      }
      html += '</div>';

      // Wrong questions with full review
      if (wrongQuestions.length > 0) {
        html += '<div style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border);"><h3 style="font-size:0.95rem;font-weight:600;margin-bottom:0.5rem;">Review Wrong Answers</h3>';
        wrongQuestions.forEach(function(w) {
          html += '<div class="question-card wrong-card">'
            + '<div class="q-number">Q' + (w.idx + 1) + ' <span class="q-chapter-tag">Ch ' + w.q.chapterNum + '</span></div>'
            + '<div class="q-text">' + w.q.text + '</div>'
            + '<div class="options">';
          for (var i = 0; i < w.q.options.length; i++) {
            var isCorrect = Array.isArray(w.q.answer) ? w.q.answer.indexOf(i) !== -1 : w.q.answer === i;
            var isUser = Array.isArray(w.userAnswer) ? w.userAnswer.indexOf(i) !== -1 : w.userAnswer === i;
            var cls = '';
            if (isCorrect) cls = 'correct-opt';
            else if (isUser) cls = 'wrong-opt';
            html += '<button class="option-btn ' + cls + '" disabled>'
              + '<span class="letter">' + letters[i] + '</span><span>' + w.q.options[i] + '</span></button>';
          }
          html += '</div>';
          html += '<div class="explanation"><strong>Explanation:</strong> ' + (w.q.justification || '') + '</div>';
          html += '</div>';
        });
        html += '</div>';
      }

      html += '</div>';
      html += '<div class="text-center mt-2"><button class="btn btn-outline" onclick="StudyApp.exam.backToPicker()">Back to Exams</button></div>';

      document.getElementById('exam-results').innerHTML = html;
    },

    backToPicker: function() {
      document.getElementById('exam-picker').classList.remove('hidden');
      document.getElementById('exam-active').classList.add('hidden');
      document.getElementById('exam-results').classList.add('hidden');
      StudyApp.renderExamPicker();
    }
  },

  renderExamPicker: function() {
    var exams = [
      { code: 'A', desc: '40 questions' },
      { code: 'B', desc: '40 questions' },
      { code: 'C', desc: '40 questions' },
      { code: 'D', desc: '40 questions' },
      { code: 'MIX', desc: 'Random Mix (40q)' }
    ];
    var html = '';
    exams.forEach(function(e) {
      var count = e.code === 'MIX' ? ALL_QUESTIONS.length : ALL_QUESTIONS.filter(function(q) { return q.exam === e.code; }).length;
      html += '<div class="exam-pick-card" onclick="StudyApp.exam.pick(\'' + e.code + '\')">'
        + '<div class="exam-letter">' + e.code + '</div>'
        + '<div class="exam-desc">' + (e.code === 'MIX' ? 'Random Mix' : 'Exam ' + e.code) + '</div>'
        + '<div class="exam-desc">' + count + ' available</div>'
        + '</div>';
    });
    document.getElementById('exam-choices').innerHTML = html;
    document.getElementById('exam-picker').classList.remove('hidden');
    document.getElementById('exam-active').classList.add('hidden');
    document.getElementById('exam-results').classList.add('hidden');
  },

  /* ============================================================
     INIT
     ============================================================ */
  init: function() {
    this.loadState();
    this.renderDashboard();
  }
};

StudyApp.init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
